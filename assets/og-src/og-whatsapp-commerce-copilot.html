<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<title>OG — WhatsApp Commerce Copilot</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Newsreader:opsz,wght@6..72,300..600&family=Martian+Mono:wght@400;600&display=block" rel="stylesheet"><link rel="stylesheet" href="_base.css">
<style>
  .title { font-size:74px; max-width:820px; }
  .sub { max-width:760px; font-size:24px; }
  /* Motif: the grounding pipeline — message enters, catalogue constrains, reply leaves. */
  .flow { display:flex; align-items:center; gap:14px; margin-top:34px; margin-bottom:14px; }
  .step { font-family:'Martian Mono', ui-monospace, Menlo, monospace; font-size:12px;
    letter-spacing:.1em; text-transform:uppercase; color:#16181C;
    border:1px solid #B4B3AA; background:#F6F5F1; padding:11px 15px; white-space:nowrap; }
  .step.key { border-color:#1B2ED8; color:#1B2ED8; }
  .arrow { width:22px; height:1px; background:#B4B3AA; position:relative; flex:none; }
  .arrow::after { content:''; position:absolute; right:0; top:-3px;
    border-left:6px solid #B4B3AA; border-top:3.5px solid transparent;
    border-bottom:3.5px solid transparent; }
</style></head><body>
<span class="tick tl"></span><span class="tick tr"></span><span class="tick bl"></span><span class="tick br"></span>
<div class="card">
  <div class="eyebrow">Case study · Agentic AI</div>
  <div>
    <div class="title">WhatsApp<br>Commerce Copilot</div>
    <div class="rule"></div>
    <div class="sub">Catalogue-grounded AI replies for a clothing brand's WhatsApp customers, with one-click handoff to a person.</div>
    <div class="flow">
      <span class="step">Customer</span><span class="arrow"></span>
      <span class="step">Gateway</span><span class="arrow"></span>
      <span class="step">FastAPI</span><span class="arrow"></span>
      <span class="step key">Catalogue</span><span class="arrow"></span>
      <span class="step">Grounded reply</span>
    </div>
  </div>
  <div class="foot"><div class="byline"><span class="dot"></span>Sajid Islam</div>
    <div class="domain">sajiddev.systems</div></div>
</div></body></html>
